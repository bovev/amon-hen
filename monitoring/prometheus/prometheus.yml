global:
  scrape_interval: 5s
  evaluation_interval: 15s

storage:
  tsdb:
    retention:
      time: 30d
      size: 5GB

scrape_configs:
  - job_name: llama_cpp
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/llama_api_key
    static_configs:
      - targets:
          - llama-server:8080
